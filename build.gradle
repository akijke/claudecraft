plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

loom {
    splitEnvironmentSourceSets()
    runs {
        // gradlew runShots: screenshots of the settings screen and chat styling (DevShots).
        shots {
            client()
            name = 'Claudecraft screenshots'
            vmArg '-Dclaudecraft.devshots=true'
            runDir 'run'
        }
        // gradlew runLiveTest: drives the mod in a real test world, report in run/livetest/report.md.
        liveTest {
            client()
            name = 'Claudecraft live test'
            vmArg '-Dclaudecraft.livetest=true'
            runDir 'run'
        }
    }
    mods {
        'claude_chat' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    // Mod Menu (optional): settings button in the mods list.
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // gradlew test: JUnit tests of the client code that needs no running game (src/test/java)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    test {
        compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
        runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output
    }
}

test {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
    // The mod extracts and starts this copy of the bridge (BridgeLauncher).
    from('bridge') {
        into 'claudecraft/bridge'
        include 'bridge.py', 'requirements.txt', 'backends/*.py'
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
