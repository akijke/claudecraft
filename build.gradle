plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

// Addon subprojects bundled into this mod (see dependencies and the run tasks below).
ext.ADDONS = ['codexcraft', 'geminicraft', 'overlaycraft']

loom {
    splitEnvironmentSourceSets()
    runs {
        // gradlew runShots: screenshots of the settings screen and chat styling (DevShots).
        shots {
            client()
            name = 'Claudecraft screenshots'
            vmArg '-Dclaudecraft.devshots=true'
            runDir 'run'
        }
        // gradlew runLiveTest: drives the mod in a real test world, report in run/livetest/report.md.
        liveTest {
            client()
            name = 'Claudecraft live test'
            vmArg '-Dclaudecraft.livetest=true'
            runDir 'run'
        }
    }
    mods {
        'claude_chat' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    // Mod Menu (optional): settings button in the mods list.
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

// The main mod without the nested addons: the addons' own dev runs (:codexcraft:runShots…)
// load it, because the full jar would bring a second copy of the addon itself.
tasks.register('bareJar', Jar) {
    archiveClassifier = 'bare'
    destinationDirectory = layout.buildDirectory.dir('bare')
    from sourceSets.main.output
    from sourceSets.client.output
}
// The addons' tasks must exist before the dependencies below refer to their jars
// (and they refer back to bareJar, registered above).
ADDONS.each { evaluationDependsOn(":${it}") }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // gradlew test: JUnit tests of the client code that needs no running game (src/test/java)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // One jar, one game: the addons ship inside claude-chat-<version>.jar (Fabric jar-in-jar,
    // META-INF/jars), and the dev runs (:runClient, :runShots, :runLiveTest) load their jars too.
    // No more `:overlaycraft:installToClaudecraft` or copying jars into run/mods.
    for (String addon : ADDONS) {
        include project(":${addon}")
        localRuntime files(rootProject.project(":${addon}").tasks.named('jar').flatMap { it.archiveFile })
    }
}

// The addons now come from the classpath (dev) or from inside the jar (release). A copy left in
// run/mods by the old installToClaudecraft (or a hand-copied addon jar) would load the same mod
// id twice, and Fabric refuses to start with duplicate mods: remove such copies before a run.
def runMods = file('run/mods')
def addonNames = ADDONS
tasks.withType(JavaExec).configureEach {
    doFirst {
        if (!runMods.isDirectory()) return
        runMods.listFiles().findAll { f -> addonNames.any { f.name.startsWith("${it}-") && f.name.endsWith('.jar') } }.each {
            logger.lifecycle("Claudecraft: removing run/mods/${it.name} (the addon is built in now)")
            it.delete()
        }
    }
}

sourceSets {
    test {
        compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
        runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output
    }
}

test {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
    // The mod extracts and starts this copy of the bridge (BridgeLauncher).
    from('bridge') {
        into 'claudecraft/bridge'
        include 'bridge.py', 'requirements.txt', 'backends/*.py'
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
