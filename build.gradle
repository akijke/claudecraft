plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

loom {
    splitEnvironmentSourceSets()
    runs {
        // gradlew runShots: screenshots of the settings screen and chat styling (DevShots).
        shots {
            client()
            name = 'Claudecraft screenshots'
            vmArg '-Dclaudecraft.devshots=true'
            runDir 'run'
        }
    }
    mods {
        'claude_chat' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    // Mod Menu (optional): settings button in the mods list.
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
    // The mod extracts and starts this copy of the bridge (BridgeLauncher).
    from('bridge') {
        into 'claudecraft/bridge'
        include 'bridge.py', 'requirements.txt', 'backends/*.py'
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
