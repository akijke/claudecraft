plugins {
    id 'net.fabricmc.fabric-loom'
}

// Overlaycraft: a translucent HUD overlay (music, Yandex Eda order, browser tabs).
// A standalone addon: unlike Codexcraft/Geminicraft it copies no code from the main mod
// and runs with or without Claudecraft installed.
version = '0.4.0'
group = 'dev.overlaycraft'
base { archivesName = 'overlaycraft' }

loom {
    splitEnvironmentSourceSets()
    runs {
        // gradlew :overlaycraft:runShots: draws the widgets with sample data, saves PNGs to run/screenshots
        shots {
            client()
            name = 'Overlaycraft screenshots'
            vmArg '-Doverlaycraft.devshots=true'
            runDir 'run'
        }
        // gradlew :overlaycraft:runLiveTest: a test world, the cards in game, chat and inventory; report in run/livetest
        liveTest {
            client()
            name = 'Overlaycraft live test'
            vmArg '-Doverlaycraft.livetest=true'
            runDir 'run'
        }
    }
    mods {
        overlaycraft {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
    // The mod unpacks these to config/overlaycraft on start
    from('browser-extension') { into 'overlaycraft/browser-extension' }
    from('claude-extension') { into 'overlaycraft/claude-extension' }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Overlaycraft is built into Claudecraft now (jar-in-jar; `gradlew :runClient` loads it).
// The old installToClaudecraft task only cleans up: a copy in the main run/mods would load the
// mod twice, and Fabric refuses to start with a duplicate mod id.
tasks.register('installToClaudecraft') {
    def mods = rootProject.file('run/mods')
    doLast {
        if (mods.isDirectory())
            mods.listFiles().findAll { it.name.startsWith('overlaycraft-') && it.name.endsWith('.jar') }.each { it.delete() }
        logger.lifecycle('Overlaycraft is part of Claudecraft now: just run `gradlew :runClient`.')
    }
}
