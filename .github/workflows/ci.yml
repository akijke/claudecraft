# Tests on every push and pull request: the Python bridge (also against the real bundled
# Claude Code CLI with a local fake API — no keys, no tokens), both mods with JUnit,
# Codexcraft's payload tests, and the screenshot run under a virtual display.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Bridge tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: bridge/requirements.txt
      - run: python -m pip install -r bridge/requirements.txt
      - name: Unit tests + real CLI against the fake API
        working-directory: bridge
        env:
          CLAUDECRAFT_CLI_IT: '1'
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com
        run: python -m unittest -v test_bridge test_cli_fake_api

  mods:
    name: Build all mods + JUnit + addon tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: chmod +x gradlew
      - name: gradlew build (Claudecraft + Codexcraft, runs JUnit)
        run: ./gradlew build --stacktrace
      - name: Codexcraft and Geminicraft payload tests
        run: |
          python -m pip install -r bridge/requirements.txt
          python -m unittest discover -s codexcraft/tests -v
          python -m unittest discover -s geminicraft/tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jars
          path: |
            build/libs/*.jar
            codexcraft/build/libs/*.jar
            geminicraft/build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: junit-report
          path: build/reports/tests/test

  screenshots:
    name: runShots under Xvfb
    runs-on: ubuntu-latest
    needs: mods
    # A software-rendered Minecraft can be flaky on hosted runners: report, don't block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Virtual display and Mesa (software OpenGL)
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri libopenal1
      - run: chmod +x gradlew
      - name: gradlew runShots
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runShots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: run/screenshots/*.png
          if-no-files-found: warn
